<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Acesso não autorizado | HorizonteMZ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--azul:#0057C2;--bg:#F4F7FF;--card:#fff;--texto:#1A1A2E;--texto2:#667085;--borda:#DDE3F0}
body.dark{--bg:#0D1117;--card:#161B27;--texto:#E8EEFF;--texto2:#8899BB;--borda:#253050}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--texto);font-family:'Segoe UI',system-ui,sans-serif;padding:24px}.topbar{position:fixed;top:0;left:0;right:0;height:64px;background:var(--card);border-bottom:1px solid var(--borda);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:800;color:var(--azul);text-decoration:none;font-size:1.15rem}.hmz-back-page{background:transparent;color:var(--texto);border:1px solid var(--borda);border-radius:8px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}.card{max-width:560px;width:100%;text-align:center;background:var(--card);border:1px solid var(--borda);border-radius:18px;padding:42px 28px;box-shadow:0 14px 40px rgba(0,0,0,.08)}.ic{font-size:2.6rem;color:var(--azul);margin-bottom:18px}h1{margin:0 0 8px;font-size:1.55rem}p{color:var(--texto2);line-height:1.65;margin:0 auto 22px}.btn{display:inline-flex;align-items:center;gap:7px;background:var(--azul);color:#fff;text-decoration:none;border-radius:8px;padding:10px 18px;font-weight:700}.back{display:inline-flex;align-items:center;gap:7px;background:transparent;color:var(--texto);border:1px solid var(--borda);border-radius:8px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;margin-left:8px}@media(max-width:520px){.back{margin:8px 0 0}}

/* HMZ — BOTÃO VOLTAR PADRÃO */
.hmz-back-page{background:rgba(255,255,255,.15)!important;border:none!important;color:#fff!important;cursor:pointer;display:inline-flex!important;align-items:center;justify-content:center;gap:5px;font-family:inherit;font-size:.82rem;font-weight:600;text-decoration:none;padding:6px 12px;border-radius:8px;transition:all .2s ease;white-space:nowrap;}
.hmz-back-page:hover{background:rgba(255,255,255,.28)!important;transform:none;}
@media(max-width:760px){.hmz-back-page{padding:6px 10px;font-size:.80rem;}}


/* HMZ MOBILE RESPONSIVENESS — compactação do cabeçalho e toque */
*{-webkit-tap-highlight-color:transparent;}
@media(max-width:960px){
  header{max-width:100%;padding-left:16px!important;padding-right:16px!important;gap:10px;}
  .h-dir{min-width:0;gap:6px!important;}
  .filtros-mob-btn{display:inline-flex!important;visibility:visible!important;opacity:1!important;position:relative!important;z-index:20!important;}
  .filtros-overlay{z-index:300!important;}
  .filtros-drawer{width:min(88vw,320px)!important;max-width:320px;z-index:310!important;}
}
@media(max-width:560px){
  header{height:auto!important;min-height:var(--header-h,65px);}
  .h-dir .btn-h,.h-dir .hmz-back-page{width:42px;min-width:42px;height:42px;padding:0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:0!important;}
  .h-dir .btn-h{font-size:0!important;}
  .h-dir .btn-h i,.h-dir .hmz-back-page i{font-size:1rem!important;margin:0!important;}
  .h-dir .hmz-back-page{font-size:0!important;}
  .h-dir .btn-dark,.h-dir .btn-burger{width:42px!important;height:42px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;}
  .btn-sair span{display:none!important;}
  .btn-sair{width:42px!important;height:42px!important;padding:0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;}
  .btn-cfg-header{width:42px!important;height:42px!important;padding:0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;}
  .filtros-mob-btn{min-height:44px!important;}
}

</style>
<style id="hmz-standard-back-final">
.hmz-back-page{background:rgba(255,255,255,.15)!important;border:none!important;color:#fff!important;cursor:pointer;display:inline-flex!important;align-items:center;justify-content:center;gap:5px;font-family:inherit;font-size:.82rem;font-weight:600;text-decoration:none;padding:6px 12px;border-radius:8px;transition:all .2s ease;white-space:nowrap;}
.hmz-back-page:hover{background:rgba(255,255,255,.28)!important;transform:none!important;}
@media(max-width:760px){.hmz-back-page{padding:6px 10px;font-size:.80rem;}}
</style>
</head>
<body><header class="topbar"><a class="brand" href="index.html">HorizonteMZ</a><button class="hmz-back-page" onclick="history.back()"><i class="fas fa-arrow-left"></i> Voltar</button></header><main class="card"><div class="ic"><i class="fas fa-shield-halved"></i></div><h1>Acesso não autorizado</h1><p>Não tens permissão para visualizar este conteúdo. O acesso ao CV é limitado ao próprio utilizador e às organizações relacionadas com uma candidatura.</p><a class="btn" href="index.html"><i class="fas fa-home"></i> Início</a></main></body></html>
