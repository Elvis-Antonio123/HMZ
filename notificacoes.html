<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notificações | HorizonteMZ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root{--azul:#0057C2;--azul-dark:#003F8F;--azul-light:#EEF4FF;--amarelo:#FFBE00;--verde:#1DB954;--vermelho:#E53935;--bg:#F4F7FF;--bg2:#FFFFFF;--texto:#1A1A2E;--texto2:#555577;--borda:#DDE3F0;--sombra:rgba(0,87,194,0.08);--sidebar-w:260px;--header-h:65px;--radius:14px;--radius-sm:8px;--trans:all 0.25s ease;}
    body.dark{--azul:#4A9EFF;--azul-dark:#2979D9;--azul-light:#0D1B3E;--bg:#0D1117;--bg2:#161B27;--texto:#E8EEFF;--texto2:#8899BB;--borda:#253050;--sombra:rgba(0,0,0,0.25);}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--texto);min-height:100vh;transition:background 0.3s,color 0.3s;}
    a{text-decoration:none;color:inherit;}
    header{background:var(--azul);height:var(--header-h);padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 20px rgba(0,0,0,0.20);}
    .h-esq{display:flex;align-items:center;gap:16px;}
    .logo{font-size:1.35rem;font-weight:800;color:#fff;letter-spacing:-0.5px;}.logo span{color:var(--amarelo);}
    .btn-burger{display:none;background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;padding:7px;border-radius:var(--radius-sm);}
    .h-dir{display:flex;align-items:center;gap:8px;}
    .btn-dark{background:none;border:none;color:#fff;font-size:1rem;cursor:pointer;padding:7px;border-radius:var(--radius-sm);transition:var(--trans);}
    .btn-dark:hover{background:rgba(255,255,255,0.18);}
    .user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:50px;padding:5px 14px 5px 6px;color:#fff;font-size:0.85rem;font-weight:600;}
    .user-avatar{width:30px;height:30px;border-radius:50%;background:var(--amarelo);color:#1a1a2e;display:flex;align-items:center;justify-content:center;font-size:0.78rem;font-weight:800;flex-shrink:0;}
    .btn-sair{background:rgba(255,255,255,0.15);border:none;color:#fff;padding:6px 12px;border-radius:var(--radius-sm);font-size:0.82rem;cursor:pointer;font-weight:600;font-family:inherit;transition:var(--trans);display:inline-flex;align-items:center;gap:5px;}
    .btn-sair:hover{background:rgba(255,255,255,0.28);}
    .layout{display:flex;min-height:calc(100vh - var(--header-h));}
    .sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--borda);padding:24px 0;position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));overflow-y:auto;flex-shrink:0;}
    .sidebar-label{font-size:0.70rem;font-weight:700;letter-spacing:0.8px;color:var(--texto2);padding:0 20px;margin-bottom:4px;text-transform:uppercase;opacity:0.7;}
    .nav-item{display:flex;align-items:center;gap:12px;padding:10px 20px;font-size:0.88rem;font-weight:600;color:var(--texto2);cursor:pointer;transition:var(--trans);border-left:3px solid transparent;}
    .nav-item:hover{background:var(--azul-light);color:var(--azul);border-left-color:var(--azul);}
    .nav-item.ativo{background:var(--azul-light);color:var(--azul);border-left-color:var(--azul);}
    .nav-item i{width:18px;text-align:center;}
    .sidebar-div{height:1px;background:var(--borda);margin:12px 16px;}
    .conteudo{flex:1;padding:28px;overflow-x:hidden;}
    .pg-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:16px;}
    .pg-header h1{font-size:1.6rem;font-weight:800;letter-spacing:-0.3px;}
    .pg-header p{font-size:0.88rem;color:var(--texto2);margin-top:4px;}
    .btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:var(--radius-sm);font-size:0.88rem;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:var(--trans);text-decoration:none;}
    .btn-outline{background:transparent;border:1.5px solid var(--borda);color:var(--texto2);}
    .btn-outline:hover{border-color:var(--azul);color:var(--azul);}
    .filtros-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
    .filtro-btn{padding:7px 16px;border-radius:50px;border:1.5px solid var(--borda);background:var(--bg2);color:var(--texto2);font-size:0.84rem;font-weight:600;cursor:pointer;transition:var(--trans);font-family:inherit;}
    .filtro-btn:hover,.filtro-btn.ativo{background:var(--azul-light);border-color:var(--azul);color:var(--azul);}
    .notif-lista{display:flex;flex-direction:column;gap:12px;}
    .notif-item{background:var(--bg2);border-radius:var(--radius);border:1.5px solid var(--borda);padding:18px 20px;display:flex;gap:14px;align-items:flex-start;transition:var(--trans);cursor:pointer;}
    .notif-item:hover{box-shadow:0 4px 16px var(--sombra);}
    .notif-item.nao-lida{border-left:3px solid var(--azul);}
    .notif-ic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
    .notif-corpo{flex:1;}
    .notif-corpo h4{font-size:0.90rem;font-weight:700;margin-bottom:4px;}
    .notif-corpo p{font-size:0.84rem;color:var(--texto2);line-height:1.55;margin-bottom:6px;}
    .notif-corpo small{font-size:0.77rem;color:var(--texto2);display:flex;align-items:center;gap:5px;}
    .notif-ponto{width:8px;height:8px;border-radius:50%;background:var(--azul);flex-shrink:0;margin-top:6px;}
    .empty-state{text-align:center;padding:64px 24px;background:var(--bg2);border-radius:var(--radius);border:1.5px dashed var(--borda);}
    .empty-ic{width:80px;height:80px;border-radius:50%;background:var(--azul-light);color:var(--azul);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 20px;}
    .empty-state h3{font-size:1rem;font-weight:800;margin-bottom:8px;}
    .empty-state p{font-size:0.86rem;color:var(--texto2);}
    #toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
    .toast{background:var(--bg2);border:1px solid var(--borda);border-left:4px solid var(--azul);color:var(--texto);padding:13px 18px;border-radius:var(--radius-sm);font-size:0.88rem;box-shadow:0 8px 24px rgba(0,0,0,0.15);animation:toastIn 0.3s ease;pointer-events:all;max-width:320px;}
    .toast.sucesso{border-left-color:var(--verde);}
    @keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
    @keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(40px)}}
    footer{background:#0D1B3E;color:rgba(255,255,255,0.50);text-align:center;padding:18px 24px;font-size:0.82rem;}
    footer strong{color:rgba(255,255,255,0.80);}
    @media(max-width:900px){.sidebar{position:fixed;top:var(--header-h);left:0;height:calc(100vh - var(--header-h));transform:translateX(-100%);z-index:150;box-shadow:4px 0 20px rgba(0,0,0,0.15);}.sidebar.aberta{transform:translateX(0);}.btn-burger{display:flex;}.conteudo{padding:20px 16px;}}
  
    /* HMZ GLOBAL FIXES */
    html{overflow-x:hidden !important;}
    body{overflow-x:hidden !important;}
    *{word-break:break-word;overflow-wrap:anywhere;}


/* HMZ MOBILE RESPONSIVENESS — compactação do cabeçalho e toque */
*{-webkit-tap-highlight-color:transparent;}
@media(max-width:960px){
  header{max-width:100%;padding-left:16px!important;padding-right:16px!important;gap:10px;}
  .h-dir{min-width:0;gap:6px!important;}
  .filtros-mob-btn{display:inline-flex!important;visibility:visible!important;opacity:1!important;position:relative!important;z-index:20!important;}
  .filtros-overlay{z-index:300!important;}
  .filtros-drawer{width:min(88vw,320px)!important;max-width:320px;z-index:310!important;}
}
@media(max-width:560px){
  header{height:auto!important;min-height:var(--header-h,65px);}
  .h-dir .btn-h,.h-dir .hmz-back-page{width:42px;min-width:42px;height:42px;padding:0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:0!important;}
  .h-dir .btn-h{font-size:0!important;}
  .h-dir .btn-h i,.h-dir .hmz-back-page i{font-size:1rem!important;margin:0!important;}
  .h-dir .hmz-back-page{font-size:0!important;}
  .h-dir .btn-dark,.h-dir .btn-burger{width:42px!important;height:42px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;}
  .btn-sair span{display:none!important;}
  .btn-sair{width:42px!important;height:42px!important;padding:0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;}
  .btn-cfg-header{width:42px!important;height:42px!important;padding:0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;}
  .filtros-mob-btn{min-height:44px!important;}
}

</style>

</head>
<body>


<header>
  <div class="h-esq">
    <button class="btn-burger" onclick="toggleSidebar()" aria-label="Menu"><i class="fas fa-bars" id="burger-icon"></i></button>
    <a href="index.html" class="logo">Horizonte<span>MZ</span></a>
  </div>
  <div class="h-dir">
    <div class="user-chip"><div class="user-avatar" id="avatar-iniciais">?</div><span id="chip-nome">Utilizador</span></div>
    <button class="btn-sair" type="button" onclick="location.href='dashboard-utilizador.html'" aria-label="Voltar à Visão Geral"><i class="fas fa-arrow-left"></i> Voltar</button>
    </div>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-label" style="margin-bottom:8px;">Principal</div>
    <div class="nav-item" onclick="location.href='dashboard-utilizador.html'"><i class="fas fa-home"></i> Painel</div>
    <div class="nav-item" onclick="location.href='explorar.html'"><i class="fas fa-search"></i> Explorar</div>
    <div class="nav-item" onclick="location.href='meu-cv.html'"><i class="fas fa-file-alt"></i> Meu CV</div>
    <div class="nav-item" onclick="location.href='minhas-candidaturas.html'"><i class="fas fa-paper-plane"></i> Candidaturas</div>
    <div class="sidebar-div"></div>
    <div class="sidebar-label" style="margin-bottom:8px;">Conta</div>
    <div class="nav-item ativo"><i class="fas fa-bell"></i> Notificações</div>
    <div class="nav-item" onclick="location.href='configuracoes-utilizador.html'"><i class="fas fa-cog"></i> Configurações</div>
    <div class="nav-item" onclick="location.href='perfil-utilizador.html'"><i class="fas fa-user"></i> Meu Perfil</div>
    <div class="nav-item" onclick="sair()"><i class="fas fa-sign-out-alt"></i> Sair</div>
  </aside>
  <div id="overlay" onclick="fecharSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:140;"></div>
  <main class="conteudo">
    <div class="pg-header">
      <div><h1><i class="fas fa-bell" style="color:var(--azul)"></i> Notificações</h1><p>As tuas notificações mais recentes.</p></div>
      <button class="btn btn-outline" onclick="marcarTodasLidas()"><i class="fas fa-check-double"></i> Marcar todas como lidas</button>
    </div>
    <div class="filtros-bar">
      <button class="filtro-btn ativo" onclick="filtrar(this,'todas')">Todas</button>
      <button class="filtro-btn" onclick="filtrar(this,'nao-lidas')">Não lidas</button>
      <button class="filtro-btn" onclick="filtrar(this,'oportunidades')">Oportunidades</button>
      <button class="filtro-btn" onclick="filtrar(this,'candidaturas')">Candidaturas</button>
      <button class="filtro-btn" onclick="filtrar(this,'sistema')">Sistema</button>
    </div>
    <div id="notif-lista"></div>
  </main>
</div>
<footer><strong>HorizonteMZ</strong> &copy; 2026</footer>
<div id="toast-container" aria-live="polite"></div>
<script>
  const KEYS={tema:'hmz_tema',sessaoUtil:'hmz_sessao_utilizador',utilizadores:'hmz_utilizadores',notificacoes:'hmz_notificacoes'};
  let sessao=null;let filtroAtual='todas';
  function lsGet(k,d=null){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d;}catch{return d;}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){console.error('Falha ao guardar dados:',e);return false;}}
  function iniciais(nome){if(!nome)return'?';const p=nome.split(' ');return(p[0][0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();}
  function formatarData(iso){if(!iso)return'';return new Date(iso).toLocaleString('pt-MZ',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
  function aplicarTema(dark){document.body.classList.toggle('dark',dark);const icon=document.getElementById('dark-icon');if(icon)icon.className=dark?'fas fa-sun':'fas fa-moon';}
  function toggleDark(){const dark=!document.body.classList.contains('dark');lsSet(KEYS.tema,dark?'dark':'light');aplicarTema(dark);}
  if(lsGet(KEYS.tema)==='dark')aplicarTema(true);
  function mostrarToast(msg,tipo=''){const cont=document.getElementById('toast-container');const t=document.createElement('div');t.className='toast '+tipo;t.textContent=msg;cont.appendChild(t);setTimeout(()=>{t.style.animation='toastOut 0.3s ease forwards';setTimeout(()=>t.remove(),300);},3500);}
  let sbAberta=false;
  function toggleSidebar(){sbAberta?fecharSidebar():abrirSidebar();}
  function abrirSidebar(){sbAberta=true;document.getElementById('sidebar').classList.add('aberta');document.getElementById('overlay').style.display='block';document.getElementById('burger-icon').className='fas fa-times';}
  function fecharSidebar(){sbAberta=false;document.getElementById('sidebar').classList.remove('aberta');document.getElementById('overlay').style.display='none';document.getElementById('burger-icon').className='fas fa-bars';}
  function sair(){lsSet(KEYS.sessaoUtil,null);window.location.href='index.html';}
  const EXEMPLOS=[];
  function chaveNotificacoes(){return KEYS.notificacoes+':'+String(sessao.id);}
  function getNotifs(){const dados=lsGet(chaveNotificacoes(),EXEMPLOS);return Array.isArray(dados)?dados:[];}
  function saveNotifs(n){return lsSet(chaveNotificacoes(),n);}
  function filtrar(btn,tipo){filtroAtual=tipo;document.querySelectorAll('.filtro-btn').forEach(b=>b.classList.remove('ativo'));btn.classList.add('ativo');renderizar();}
  function marcarLida(id){const n=getNotifs();const idx=n.findIndex(x=>x.id===id);if(idx!==-1){n[idx].lida=true;saveNotifs(n);renderizar();}}
  function marcarTodasLidas(){const n=getNotifs();if(!n.length){mostrarToast('Não existem notificações para actualizar.');return;}const actualizadas=n.map(x=>({...x,lida:true}));if(!saveNotifs(actualizadas)){mostrarToast('Não foi possível guardar as alterações. Tenta novamente.','erro');return;}const confirmacao=getNotifs();if(confirmacao.length!==actualizadas.length||confirmacao.some(x=>!x.lida)){mostrarToast('Não foi possível confirmar a actualização das notificações.','erro');return;}renderizar();mostrarToast('Todas as notificações foram marcadas como lidas.','sucesso');}
  function renderizar(){
    const notifs=getNotifs();
    let filtradas=notifs;
    if(filtroAtual==='nao-lidas')filtradas=notifs.filter(n=>!n.lida);
    else if(filtroAtual!=='todas')filtradas=notifs.filter(n=>n.tipo===filtroAtual);
    const lista=document.getElementById('notif-lista');
    if(!filtradas.length){lista.innerHTML=`<div class="empty-state"><div class="empty-ic"><i class="fas fa-bell"></i></div><h3>Sem notificações</h3><p>Não tens notificações${filtroAtual!=='todas'?' nesta categoria':''} de momento.</p></div>`;return;}
    lista.innerHTML=`<div class="notif-lista">${filtradas.map(n=>`
      <div class="notif-item ${n.lida?'':'nao-lida'}" onclick="marcarLida('${n.id}');location.href='${n.link||'#'}'" role="button" tabindex="0">
        <div class="notif-ic" style="background:${n.bg};color:${n.cor};"><i class="fas ${n.ic}"></i></div>
        <div class="notif-corpo">
          <h4>${n.titulo}</h4>
          <p>${n.msg}</p>
          <small><i class="fas fa-clock"></i>${formatarData(n.data)}</small>
        </div>
        ${!n.lida?'<div class="notif-ponto"></div>':''}
      </div>`).join('')}</div>`;
  }
  document.addEventListener('DOMContentLoaded',function(){
    sessao=lsGet(KEYS.sessaoUtil);
    if(!sessao){window.location.href='login-utilizador.html';return;}
    const contaAtual=lsGet(KEYS.utilizadores,[]).find(u=>String(u.id)===String(sessao.id));
    if(!contaAtual){lsSet(KEYS.sessaoUtil,null);window.location.href='login-utilizador.html';return;}
    sessao=contaAtual;
    document.getElementById('avatar-iniciais').textContent=iniciais(sessao.nome);
    document.getElementById('chip-nome').textContent=sessao.nome?sessao.nome.split(' ')[0]:'Utilizador';
    renderizar();
  });
</script>
</body>
</html>
