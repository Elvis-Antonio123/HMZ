<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Candidatos | HorizonteMZ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root{--laranja:#D97706;--laranja-dark:#92400E;--laranja-light:#FEF3C7;--azul:#0057C2;--azul-light:#EEF4FF;--amarelo:#FFBE00;--verde:#1DB954;--vermelho:#E53935;--bg:#F4F7FF;--bg2:#FFFFFF;--texto:#1A1A2E;--texto2:#555577;--borda:#DDE3F0;--sombra:rgba(217,119,6,0.08);--sidebar-w:260px;--header-h:65px;--radius:14px;--radius-sm:8px;--trans:all 0.25s ease;}
    body.dark{--laranja:#F59E0B;--laranja-dark:#78350F;--laranja-light:#2d1f0a;--azul:#4A9EFF;--azul-light:#0D1B3E;--bg:#0D1117;--bg2:#161B27;--texto:#E8EEFF;--texto2:#8899BB;--borda:#253050;}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--texto);min-height:100vh;transition:background 0.3s,color 0.3s;}
    a{text-decoration:none;color:inherit;}
    header{background:linear-gradient(135deg,var(--laranja-dark),var(--laranja));height:var(--header-h);padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 20px rgba(0,0,0,0.20);}
    .h-esq{display:flex;align-items:center;gap:16px;}
    .logo{font-size:1.35rem;font-weight:800;color:#fff;letter-spacing:-0.5px;}.logo span{color:#FEF3C7;}
    .btn-burger{display:none;background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;padding:7px;border-radius:var(--radius-sm);}
    .h-dir{display:flex;align-items:center;gap:8px;}
    .btn-dark{background:none;border:none;color:#fff;font-size:1rem;cursor:pointer;padding:7px;border-radius:var(--radius-sm);transition:var(--trans);}
    .btn-dark:hover{background:rgba(255,255,255,0.18);}
    .emp-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:50px;padding:5px 14px 5px 6px;color:#fff;font-size:0.85rem;font-weight:600;}
    .emp-av{width:30px;height:30px;border-radius:50%;background:#FEF3C7;color:#92400E;display:flex;align-items:center;justify-content:center;font-size:0.78rem;font-weight:800;flex-shrink:0;}
    .btn-sair{background:rgba(255,255,255,0.15);border:none;color:#fff;padding:6px 12px;border-radius:var(--radius-sm);font-size:0.82rem;cursor:pointer;font-weight:600;font-family:inherit;transition:var(--trans);display:inline-flex;align-items:center;gap:5px;}
    .btn-sair:hover{background:rgba(255,255,255,0.28);}
    .layout{display:flex;min-height:calc(100vh - var(--header-h));}
    .sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--borda);padding:24px 0;position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));overflow-y:auto;flex-shrink:0;}
    .sidebar-label{font-size:0.70rem;font-weight:700;letter-spacing:0.8px;color:var(--texto2);padding:0 20px;margin-bottom:4px;text-transform:uppercase;opacity:0.7;}
    .nav-item{display:flex;align-items:center;gap:12px;padding:10px 20px;font-size:0.88rem;font-weight:600;color:var(--texto2);cursor:pointer;transition:var(--trans);border-left:3px solid transparent;}
    .nav-item:hover{background:var(--laranja-light);color:var(--laranja);border-left-color:var(--laranja);}
    .nav-item.ativo{background:var(--laranja-light);color:var(--laranja);border-left-color:var(--laranja);}
    .nav-item i{width:18px;text-align:center;}
    .sidebar-div{height:1px;background:var(--borda);margin:12px 16px;}
    .conteudo{flex:1;padding:28px;overflow-x:hidden;}
    .pg-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:16px;}
    .pg-header h1{font-size:1.6rem;font-weight:800;letter-spacing:-0.3px;}
    .pg-header p{font-size:0.88rem;color:var(--texto2);margin-top:4px;}
    .filtros-bar{background:var(--bg2);border-radius:var(--radius);border:1.5px solid var(--borda);padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    .input-busca{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--borda);border-radius:var(--radius-sm);padding:9px 14px;flex:1;min-width:180px;}
    .input-busca i{color:var(--texto2);font-size:0.88rem;}
    .input-busca input{border:none;background:none;outline:none;color:var(--texto);font-family:inherit;font-size:0.88rem;width:100%;}
    .filtro-sel{padding:9px 12px;border:1.5px solid var(--borda);border-radius:var(--radius-sm);background:var(--bg);color:var(--texto);font-family:inherit;font-size:0.85rem;outline:none;cursor:pointer;}
    .cand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;}
    .cand-card{background:var(--bg2);border-radius:var(--radius);border:1.5px solid var(--borda);padding:20px;transition:var(--trans);}
    .cand-card:hover{box-shadow:0 6px 20px var(--sombra);transform:translateY(-2px);}
    .cand-topo{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
    .cand-avatar{width:48px;height:48px;border-radius:50%;background:var(--laranja);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:800;flex-shrink:0;}
    .cand-nome h4{font-size:0.95rem;font-weight:700;margin-bottom:2px;}
    .cand-nome p{font-size:0.80rem;color:var(--texto2);}
    .cand-dados{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
    .cand-dado{display:flex;align-items:center;gap:8px;font-size:0.83rem;color:var(--texto2);}
    .cand-dado i{color:var(--laranja);width:14px;text-align:center;}
    .cand-dado span{color:var(--texto);}
    .cand-acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
    .badge{display:inline-flex;align-items:center;gap:5px;font-size:0.78rem;font-weight:700;padding:5px 12px;border-radius:20px;}
    .st-pendente{background:#FFF3CD;color:#856404;}
    .st-analise{background:#CCE5FF;color:#004085;}
    .st-entrevista{background:#E2D9F3;color:#4B0082;}
    .st-aceite{background:#D4EDDA;color:#155724;}
    .st-rejeitado{background:#F8D7DA;color:#721C24;}
    body.dark .st-pendente{background:#3d2e00;color:#f0c040;}
    body.dark .st-analise{background:#0d2d4a;color:#7ab8f5;}
    body.dark .st-entrevista{background:#2a1a3d;color:#c49df5;}
    body.dark .st-aceite{background:#1a3d28;color:#7ddb9e;}
    body.dark .st-rejeitado{background:#3d1a1e;color:#f5a0a8;}
    .empty-state{text-align:center;padding:64px 24px;background:var(--bg2);border-radius:var(--radius);border:1.5px dashed var(--borda);}
    .empty-ic{width:80px;height:80px;border-radius:50%;background:var(--laranja-light);color:var(--laranja);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 20px;}
    .empty-state h3{font-size:1rem;font-weight:800;margin-bottom:8px;}
    .empty-state p{font-size:0.86rem;color:var(--texto2);}
    #toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
    .toast{background:var(--bg2);border:1px solid var(--borda);border-left:4px solid var(--laranja);color:var(--texto);padding:13px 18px;border-radius:var(--radius-sm);font-size:0.88rem;box-shadow:0 8px 24px rgba(0,0,0,0.15);animation:toastIn 0.3s ease;pointer-events:all;max-width:320px;}
    @keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
    @keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(40px)}}
    footer{background:#0D1B3E;color:rgba(255,255,255,0.50);text-align:center;padding:18px 24px;font-size:0.82rem;}
    footer strong{color:rgba(255,255,255,0.80);}
    @media(max-width:900px){.sidebar{position:fixed;top:var(--header-h);left:0;height:calc(100vh - var(--header-h));transform:translateX(-100%);z-index:150;}.sidebar.aberta{transform:translateX(0);}.btn-burger{display:flex;}.conteudo{padding:20px 16px;}}
    @media(max-width:640px){.cand-grid{grid-template-columns:1fr;}}
  
    /* HMZ GLOBAL FIXES */
    html{overflow-x:hidden !important;}
    body{overflow-x:hidden !important;}
    *{word-break:break-word;overflow-wrap:anywhere;}


/* HMZ MOBILE RESPONSIVENESS — compactação do cabeçalho e toque */
*{-webkit-tap-highlight-color:transparent;}
@media(max-width:960px){
  header{max-width:100%;padding-left:16px!important;padding-right:16px!important;gap:10px;}
  .h-dir{min-width:0;gap:6px!important;}
  .filtros-mob-btn{display:inline-flex!important;visibility:visible!important;opacity:1!important;position:relative!important;z-index:20!important;}
  .filtros-overlay{z-index:300!important;}
  .filtros-drawer{width:min(88vw,320px)!important;max-width:320px;z-index:310!important;}
}
@media(max-width:560px){
  header{height:auto!important;min-height:var(--header-h,65px);}
  .h-dir .btn-h,.h-dir .hmz-back-page{width:42px;min-width:42px;height:42px;padding:0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:0!important;}
  .h-dir .btn-h{font-size:0!important;}
  .h-dir .btn-h i,.h-dir .hmz-back-page i{font-size:1rem!important;margin:0!important;}
  .h-dir .hmz-back-page{font-size:0!important;}
  .h-dir .btn-dark,.h-dir .btn-burger{width:42px!important;height:42px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;}
  .btn-sair span{display:none!important;}
  .btn-sair{width:42px!important;height:42px!important;padding:0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;}
  .btn-cfg-header{width:42px!important;height:42px!important;padding:0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;}
  .filtros-mob-btn{min-height:44px!important;}
}



/* HMZ MOBILE AUDIT — cards, grids e prevenção de cortes */
@media (max-width: 640px) {
  .conteudo, .main-content, .main-layout, main, .form-wrap, .content,
  .card, .content-card, .info-card, .cand-card, .op-card, .rec-card,
  .stats-grid, .cand-grid, .op-grid, .rec-grid, .areas-grid, .benef-grid,
  .modelos-grid, .mvv-grid, .info-grid, .grid-2, .grid-3 {
    min-width: 0;
    max-width: 100%;
  }
  .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cand-grid, .op-grid, .rec-grid, .areas-grid, .benef-grid,
  .modelos-grid, .mvv-grid, .info-grid, .grid-2, .grid-3 {
    grid-template-columns: minmax(0, 1fr);
  }
  .cand-card, .op-card, .rec-card, .content-card, .info-card {
    min-width: 0;
    max-width: 100%;
  }
  .cand-card, .content-card, .info-card { padding: 16px; }
  img, video, iframe { max-width: 100%; }
}
@media (max-width: 380px) {
  .stats-grid { grid-template-columns: minmax(0, 1fr); }
}

  </style>

</head>
<body>


<header>
  <div class="h-esq">
    <button class="btn-burger" onclick="toggleSidebar()" aria-label="Menu"><i class="fas fa-bars" id="burger-icon"></i></button>
    <a href="index.html" class="logo">Horizonte<span>MZ</span></a>
  </div>
  <div class="h-dir">
    <div class="emp-chip"><div class="emp-av" id="avatar-iniciais">E</div><span id="chip-nome">Empresa</span></div>
    <button class="btn-sair" type="button" onclick="location.href='dashboard-empresa.html'" aria-label="Voltar à Visão Geral"><i class="fas fa-arrow-left"></i> Voltar</button>
    </div>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-label" style="margin-bottom:8px;">Gestão</div>
    <div class="nav-item" onclick="location.href='dashboard-empresa.html'"><i class="fas fa-home"></i> Painel</div>
    <div class="nav-item" onclick="location.href='dashboard-empresa.html'"><i class="fas fa-briefcase"></i> Vagas</div>
    <div class="nav-item ativo"><i class="fas fa-users"></i> Candidatos</div>
    <div class="nav-item" onclick="location.href='criar-vaga.html'"><i class="fas fa-plus-circle"></i> Publicar Vaga</div>
    <div class="sidebar-div"></div>
    <div class="nav-item" onclick="sair()"><i class="fas fa-sign-out-alt"></i> Sair</div>
  </aside>
  <div id="overlay" onclick="fecharSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:140;"></div>
  <main class="conteudo">
    <div class="pg-header">
      <div><h1><i class="fas fa-users" style="color:var(--laranja)"></i> Candidatos</h1><p>Todos os candidatos às vagas da tua empresa.</p></div>
    </div>
    <div class="filtros-bar">
      <div class="input-busca"><i class="fas fa-search"></i><input type="text" id="busca" placeholder="Pesquisar candidato..." oninput="renderizar()"/></div>
      <select class="filtro-sel" id="filtro-vaga" onchange="renderizar()"><option value="">Todas as vagas</option></select>
      <select class="filtro-sel" id="filtro-estado" onchange="renderizar()">
        <option value="">Todos os estados</option>
        <option>Pendente</option><option>Em análise</option><option>Entrevista</option><option>Aceite</option><option>Rejeitado</option>
      </select>
    </div>
    <div id="lista-cands"></div>
  </main>
</div>
<footer><strong>HorizonteMZ</strong> &copy; 2026</footer>
<div id="toast-container" aria-live="polite"></div>
<script>
  const KEYS={tema:'hmz_tema',sessaoEmp:'hmz_sessao_empresa',vagas:'hmz_vagas',candidaturas:'hmz_candidaturas_emp',utilizadores:'hmz_utilizadores'};
  let sessao=null;let todasVagas=[];
  function lsGet(k,d=null){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d;}catch{return d;}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  function criarNotificacaoCandidato(c,estado){if(!c||(c.utilizadorId==null&&c.utilizador_id==null&&c.candidatoId==null))return;const cfg=lsGet('hmz_config_util',{});if(cfg.notif&&cfg.notif.candidaturas===false)return;const destinatario=c.utilizadorId??c.utilizador_id??c.candidatoId;const key='hmz_notificacoes:'+destinatario;const n=lsGet(key,[]);n.unshift({id:'notif_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),tipo:'candidatura',titulo:'Estado da candidatura actualizado',msg:'A tua candidatura para vaga <strong>'+(c.tituloVaga||c.tituloOp||'')+'</strong> foi alterada para <strong>'+estado+'</strong>.',data:new Date().toISOString(),lida:false,ic:'fa-file-circle-check',bg:'var(--azul-light)',cor:'var(--azul)'});lsSet(key,n);}

  function iniciais(nome){if(!nome)return'?';const p=nome.split(' ');return(p[0][0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();}
  function truncar(txt,max){return txt&&txt.length>max?txt.substring(0,max)+'...':txt||'';}
  function formatarData(iso){if(!iso)return'';return new Date(iso).toLocaleDateString('pt-MZ',{day:'2-digit',month:'short',year:'numeric'});}
  function aplicarTema(dark){document.body.classList.toggle('dark',dark);const icon=document.getElementById('dark-icon');if(icon)icon.className=dark?'fas fa-sun':'fas fa-moon';}
  function toggleDark(){const dark=!document.body.classList.contains('dark');lsSet(KEYS.tema,dark?'dark':'light');aplicarTema(dark);}
  if(lsGet(KEYS.tema)==='dark')aplicarTema(true);
  function mostrarToast(msg,tipo=''){const cont=document.getElementById('toast-container');const t=document.createElement('div');t.className='toast '+tipo;t.textContent=msg;cont.appendChild(t);setTimeout(()=>{t.style.animation='toastOut 0.3s ease forwards';setTimeout(()=>t.remove(),300);},3500);}
  let sbAberta=false;
  function toggleSidebar(){sbAberta?fecharSidebar():abrirSidebar();}
  function abrirSidebar(){sbAberta=true;document.getElementById('sidebar').classList.add('aberta');document.getElementById('overlay').style.display='block';document.getElementById('burger-icon').className='fas fa-times';}
  function fecharSidebar(){sbAberta=false;document.getElementById('sidebar').classList.remove('aberta');document.getElementById('overlay').style.display='none';document.getElementById('burger-icon').className='fas fa-bars';}
  function sair(){lsSet(KEYS.sessaoEmp,null);window.location.href='index.html';}
  function statusCls(e){const m={'Pendente':'st-pendente','Em análise':'st-analise','Entrevista':'st-entrevista','Aceite':'st-aceite','Rejeitado':'st-rejeitado'};return m[e]||'st-pendente';}
  function statusIc(e){const m={'Pendente':'fa-clock','Em análise':'fa-search','Entrevista':'fa-user-tie','Aceite':'fa-check-circle','Rejeitado':'fa-times-circle'};return m[e]||'fa-clock';}
  function alterarEstado(id,estado){
    const cands=lsGet(KEYS.candidaturas,[]);const idx=cands.findIndex(c=>String(c.id)===String(id));
    if(idx!==-1){const anterior=cands[idx].estado;if(anterior!==estado){cands[idx].estado=estado;lsSet(KEYS.candidaturas,cands);criarNotificacaoCandidato(cands[idx],estado);}mostrarToast('Estado: '+estado,'');renderizar();}
  }
  function renderizar(){
    const busca=document.getElementById('busca').value.toLowerCase();
    const vagaId=document.getElementById('filtro-vaga').value;
    const estado=document.getElementById('filtro-estado').value;
    let cands=lsGet(KEYS.candidaturas,[]).filter(c=>todasVagas.some(v=>String(v.id)===String(c.vagaId??c.vaga_id)));
    if(vagaId)cands=cands.filter(c=>String(c.vagaId??c.vaga_id)===String(vagaId));
    if(estado)cands=cands.filter(c=>c.estado===estado);
    const utils=lsGet(KEYS.utilizadores,[]);
    if(busca)cands=cands.filter(c=>{const u=utils.find(u=>String(u.id)===String(c.utilizadorId??c.utilizador_id??c.candidatoId))||{nome:c.nomeUtil||''};return(u.nome||'').toLowerCase().includes(busca);});
    const lista=document.getElementById('lista-cands');
    if(!cands.length){lista.innerHTML=`<div class="empty-state"><div class="empty-ic"><i class="fas fa-users"></i></div><h3>Sem candidatos</h3><p>Nenhum candidato encontrado com estes filtros.</p></div>`;return;}
    lista.innerHTML=`<div class="cand-grid">${cands.map(c=>{
      const u=utils.find(u=>String(u.id)===String(c.utilizadorId??c.utilizador_id??c.candidatoId))||{nome:c.nomeUtil||'Candidato',email:'',provincia:''};
      const vaga=todasVagas.find(v=>String(v.id)===String(c.vagaId??c.vaga_id));
      return`<div class="cand-card">
        <div class="cand-topo"><div class="cand-avatar">${iniciais(u.nome)}</div><div class="cand-nome"><h4>${u.nome}</h4><p>${vaga?truncar(vaga.titulo,35):'—'}</p></div></div>
        <div class="cand-dados">
          ${u.email?`<div class="cand-dado"><i class="fas fa-envelope"></i><span>${u.email}</span></div>`:''}
          ${u.provincia?`<div class="cand-dado"><i class="fas fa-map-marker-alt"></i><span>${u.provincia}</span></div>`:''}
          ${u.nivelEscolaridade?`<div class="cand-dado"><i class="fas fa-graduation-cap"></i><span>${u.nivelEscolaridade}</span></div>`:''}
          <div class="cand-dado"><i class="fas fa-calendar"></i><span>${formatarData(c.data)}</span></div>
        </div>
        <div class="cand-acoes">
          <span class="badge ${statusCls(c.estado)}"><i class="fas ${statusIc(c.estado)}"></i>${c.estado||'Pendente'}</span>
          <select onchange="alterarEstado('${c.id}',this.value)" style="margin-left:auto;padding:5px 8px;border:1.5px solid var(--borda);border-radius:var(--radius-sm);background:var(--bg);color:var(--texto);font-family:inherit;font-size:0.80rem;cursor:pointer;outline:none;">
            <option ${c.estado==='Pendente'?'selected':''}>Pendente</option>
            <option ${c.estado==='Em análise'?'selected':''}>Em análise</option>
            <option ${c.estado==='Entrevista'?'selected':''}>Entrevista</option>
            <option ${c.estado==='Aceite'?'selected':''}>Aceite</option>
            <option ${c.estado==='Rejeitado'?'selected':''}>Rejeitado</option>
          </select>
        </div>
        ${u.objectivo?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--borda);font-size:0.82rem;color:var(--texto2);">"${truncar(u.objectivo,100)}"</div>`:''}
      </div>`;}).join('')}</div>`;
  }
  document.addEventListener('DOMContentLoaded',function(){
    sessao=lsGet(KEYS.sessaoEmp);
    if(!sessao){window.location.href='login-empresa.html';return;}
    const contaAtual=lsGet(KEYS.empresas,[]).find(x=>String(x.id)===String(sessao.id));
    if(!contaAtual){lsSet(KEYS.sessaoEmp,null);window.location.href='login-empresa.html';return;}
    sessao=contaAtual;
    document.getElementById('avatar-iniciais').textContent=iniciais(sessao.nome);
    document.getElementById('chip-nome').textContent=sessao.nome?sessao.nome.split(' ')[0]:'Empresa';
    todasVagas=lsGet(KEYS.vagas,[]).filter(v=>String(v.empresaId??v.empresa_id??v.ownerId)===String(sessao.id));
    const sel=document.getElementById('filtro-vaga');
    todasVagas.forEach(v=>sel.innerHTML+=`<option value="${v.id}">${truncar(v.titulo,45)}</option>`);
    renderizar();
  });
</script>
</body>
</html>
